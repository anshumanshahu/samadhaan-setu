services:
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:5000/api}
        VITE_ML_API_URL: ${VITE_ML_API_URL:-http://localhost:8000}
    ports:
      - "5173:80"
    depends_on:
      - backend

  backend:
    build: ./backend
    env_file:
      - ./backend/.env
    environment:
      PORT: 5000
      NODE_ENV: production
      CLIENT_URL: http://localhost:5173
      ML_API_URL: http://ml:8000
    ports:
      - "5000:5000"
    depends_on:
      - ml

  ml:
    build: ./backend/ai-model
    ports:
      - "8000:8000"